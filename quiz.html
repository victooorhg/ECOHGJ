<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Quiz Ambiental | EcoInforma HGJ</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-green-50 text-green-900 font-sans">

  <div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-6 text-green-700">Quiz Ambiental 🌿</h1>
    <p class="mb-4">Teste seus conhecimentos sobre meio ambiente e descubra como pequenas ações podem transformar o planeta.</p>

    <!-- Área do quiz interativo -->
    <div id="quiz" class="bg-white rounded shadow-md p-6 space-y-4">
      <p class="font-semibold">1. Qual dessas ações ajuda a preservar o meio ambiente?</p>
      <button class="bg-green-100 hover:bg-green-200 px-4 py-2 rounded w-full text-left">a) Jogar lixo nos rios</button>
      <button class="bg-green-100 hover:bg-green-200 px-4 py-2 rounded w-full text-left">b) Reutilizar materiais e reciclar</button>
      <button class="bg-green-100 hover:bg-green-200 px-4 py-2 rounded w-full text-left">c) Deixar a torneira aberta</button>
    </div>

    <!-- Voltar -->
    <a href="index.html" class="mt-8 inline-block text-green-700 hover:underline">← Voltar para o início</a>
  </div>

</body>
</html>
